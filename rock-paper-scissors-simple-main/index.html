<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock-Paper-Scissors</title>
</head>
<body>

    <div class="content">
        <h2 class="content__title">
            Rock Paper Scissors
        </h2>

        <div class="wrapper">
            <div class="wrapper__element">
                <img class="first_player" src="./img/paper.png" alt="">
                <span class="player">player 1</span>
            </div>

            <div class="wrapper__element">
                <img class="second_player" src="./img/paper.png" alt="">
                <span class="player">player 2</span>
            </div>
        </div>
        <button class="btn">PLAY!</button>
        
        <p class="result">first player wins!</p>
    </div>
    

    <script src="./app.js"></script>
</body>
</html>
